services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viganext_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    ports:
      - "8000:9000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=viganext
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres
    networks:
      - viganext_network

  nginx:
    image: nginx:alpine
    container_name: viganext_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    depends_on:
      - web
    networks:
      - viganext_network

  postgres:
    image: postgres:16-alpine
    container_name: viganext_postgres
    environment:
      - POSTGRES_DB=viganext
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - viganext_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  viganext_network:
    driver: bridge
